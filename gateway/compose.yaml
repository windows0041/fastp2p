services:
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: openp2p-private-gateway:local
    network_mode: host
    user: "${GATEWAY_UID:-1000}:${GATEWAY_GID:-1000}"
    restart: unless-stopped
    environment:
      OPENP2P_USER: ${OPENP2P_USER:?Set OPENP2P_USER in .env}
      OPENP2P_PASSWORD: ${OPENP2P_PASSWORD:?Set OPENP2P_PASSWORD in .env}
      OPENP2P_TOKEN: ${OPENP2P_TOKEN:-}
    command: ["-bind", "${OPENP2P_BIND:-127.0.0.1}", "-cert", "/certs/server.crt", "-key", "/certs/server.key"]
    volumes:
      - ./certs/local/server.crt:/certs/server.crt:ro
      - ./certs/local/server.key:/certs/server.key:ro
      - gateway-logs:/app/log
volumes:
  gateway-logs:
