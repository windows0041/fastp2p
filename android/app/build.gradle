plugins { id 'com.android.application' }

def depsBase = providers.gradleProperty('fastp2pDepsBase').orElse(
        System.getenv('FASTP2P_DEPS_BASE') ?: "${System.getProperty('user.home')}/fastp2p-dev/cross/prefix").get()
def signingFile = System.getenv('FASTP2P_ANDROID_KEYSTORE')

android {
    namespace 'top.fastp2p.cclient'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '30.0.16248370'
    defaultConfig {
        applicationId 'top.fastp2p.cclient'
        minSdk 26
        targetSdk 36
        /* Android compares versionCode, not versionName, both when installing and when
         * the silent updater decides whether a staged package is newer. A fixed code
         * therefore made every release after it invisible to the updater, which
         * downloaded the APK and then refused it. Derive the code from the semantic
         * version so it can only move forward. */
        versionName '2.0.72'
        versionCode versionName.tokenize('.').collect { it as int }.inject(0) { acc, n -> acc * 100 + n }
        testInstrumentationRunner 'top.fastp2p.cclient.LiveInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none', '-DFASTP2P_BUILD_SHARED=ON',
                        '-DFASTP2P_BUILD_CLI=OFF', '-DBUILD_TESTING=OFF', "-DFASTP2P_DEPS_BASE=${depsBase}"
                targets 'fastp2p_jni', 'fastp2p_tun_helper'
            }
        }
    }
    externalNativeBuild {
        cmake { path '../../CMakeLists.txt'; version '3.31.6' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    signingConfigs {
        release {
            if (signingFile) {
                storeFile file(signingFile)
                storePassword System.getenv('FASTP2P_ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'fastp2p'
                keyPassword System.getenv('FASTP2P_ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
        // Same signing key and application id as release, but debuggable: it can
        // be installed over the production app to collect client logs.
        staging {
            initWith release
            debuggable true
            matchingFallbacks = ['release']
        }
    }
    testBuildType signingFile ? 'release' : 'debug'
    packaging { jniLibs { useLegacyPackaging false } }
}

// The APK is also a binary distribution of the statically bundled TLS/QUIC
// dependencies; keep their complete notices inside the installable artifact.
def noticeOutput = layout.buildDirectory.dir('generated/native-notices')
def nativeNotices = tasks.register('copyNativeNotices', Sync) {
    outputs.upToDateWhen { false }
    into noticeOutput
    from('../../LICENSE') { into 'licenses'; rename { 'fastp2p-LICENSE' } }
    from('../../THIRD_PARTY.md') { into 'licenses' }
    def versions = new groovy.json.JsonSlurper().parse(file('../../deps.lock.json'))
    versions.each { name, entry ->
        def license = entry.license ?: (name == 'openssl' ? 'LICENSE.txt' : 'COPYING')
        from(new File(new File(depsBase).parentFile, "sources/${name}-${entry.version}/${license}")) {
            into 'licenses'; rename { "${name}-${new File(license).name}" }
        }
    }
}
android.sourceSets.main.assets.srcDir(noticeOutput)
tasks.named('preBuild').configure { dependsOn nativeNotices }

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') } &&
            (!signingFile || !System.getenv('FASTP2P_ANDROID_KEYSTORE_PASSWORD')))
        throw new GradleException('Release APK requires FASTP2P_ANDROID_KEYSTORE and FASTP2P_ANDROID_KEYSTORE_PASSWORD')
}
