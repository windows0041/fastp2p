name: CI token probe
on:
  workflow_dispatch:
  push:
    tags: ['ci-push-probe-*']
# Exactly the build.yml shape: the workflow asks for read, the job asks for write.
permissions:
  contents: read
jobs:
  job-level-write:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Probe release creation
        env:
          TOKEN: ${{ github.token }}
        run: |
          set +e
          code=$(curl -sS -o /tmp/a.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
            -d '{"tag_name":"ci-probe-job-write","name":"probe","body":"probe","draft":true}')
          echo "job-level write on ref=$GITHUB_REF_NAME -> $code"
          head -c 300 /tmp/a.json; echo
          echo "---- ref details"
          curl -sS -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("event", d["event"], "head_branch", d.get("head_branch"))'
