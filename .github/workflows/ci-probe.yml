name: CI token probe
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag name to try creating a draft release for
        required: false
        default: ci-probe-release-v1
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Token permissions
        run: |
          echo "GITHUB_TOKEN Permissions"
          echo "Contents: write (declared for this job)"
          curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
               https://api.github.com/repos/"$GITHUB_REPOSITORY" | head -c 300; echo
      - name: Probe release creation
        run: |
          set +e
          code=$(curl -sS -o /tmp/release.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/"$GITHUB_REPOSITORY"/releases \
            -d "{\"tag_name\":\"${{ inputs.tag }}\",\"name\":\"probe\",\"draft\":true,\"body\":\"probe\"}")
          echo "POST /releases -> $code"
          cat /tmp/release.json; echo
      - name: Probe a contents write
        run: |
          set +e
          code=$(curl -sS -o /tmp/ref.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/"$GITHUB_REPOSITORY"/git/refs \
            -d "{\"ref\":\"refs/heads/ci-probe-tmp\",\"sha\":\"$GITHUB_SHA\"}")
          echo "POST /git/refs -> $code"
          cat /tmp/ref.json; echo
