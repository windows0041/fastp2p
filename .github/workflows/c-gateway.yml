name: fastp2p C gateway
on:
  push:
    tags: ['fastp2p-gateway-v*']
    branches: ['**']
    paths: ['c/gateway/**', 'c/common/**', 'scripts/tls/**', 'c/client/src/**', 'c/client/tests/integration.py', '.github/workflows/c-gateway.yml', 'scripts/publish-release.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c-gateway-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gateway:
    strategy:
      fail-fast: false
      matrix:
        include:
          - debian: '12'
            image: python:3.13-slim-bookworm
          - debian: '13'
            image: python:3.13-slim-trixie
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
      options: --privileged
    timeout-minutes: 35
    steps:
      - name: Install native dependencies
        run: |
          apt-get update -qq
          apt-get install -y git curl ca-certificates build-essential cmake ninja-build pkg-config python3 openssl iproute2 libwebsockets-dev libjson-c-dev libssl-dev libsqlite3-dev zstd
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: ~/fastp2p-dev/cross
          key: gateway-client-deps-debian${{ matrix.debian }}-${{ hashFiles('c/client/deps.lock.json', 'c/client/scripts/build-deps.py') }}
      - name: Build C clients
        run: |
          python3 c/client/scripts/build-deps.py linux-x86_64
          cmake -S c/client -B build/c -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFASTP2P_SANITIZE=ON -DBUILD_TESTING=OFF -DFASTP2P_DEPS_ROOT="$HOME/fastp2p-dev/cross/prefix/linux-x86_64"
          cmake --build build/c --parallel 3
      - name: fastp2p C gateway protocol, authentication and lifecycle with sanitizers
        run: |
          python3 scripts/test-publish-release.py
          bash c/gateway/scripts/check.sh --sanitize
      - name: Six C clients, TCP punch, QUIC and reconnect
        run: bash c/gateway/scripts/integration.sh
      - name: SQLite recovery and real hostname-based C clients
        run: bash c/gateway/scripts/check-registry.sh
      - name: Browser console authentication and node operations
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium > browser-install.log 2>&1 || { tail -40 browser-install.log; exit 1; }
          python3 c/gateway/tests/web_ui.py --gateway build/c-gateway/fastp2p-gateway --client build/c/fastp2p --output build/web-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-web-validation-debian${{ matrix.debian }}
          path: |
            build/web-ui/result.json
            build/web-ui/*.png
            build/registry/result.json
      - name: Package native gateway
        run: |
          cmake -S c/gateway -B build/c-gateway-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX="$PWD/dist/c-gateway-debian${{ matrix.debian }}-x86_64"
          cmake --build build/c-gateway-release --parallel 3
          cmake --install build/c-gateway-release
          cp c/gateway/README.md c/gateway/VALIDATION-ZH.md c/gateway/THIRD_PARTY.md c/gateway/LICENSE c/gateway/.env.example dist/c-gateway-debian${{ matrix.debian }}-x86_64/
          cp c/NODE-STORAGE-ZH.md dist/c-gateway-debian${{ matrix.debian }}-x86_64/
          cp -R c/gateway/deploy dist/c-gateway-debian${{ matrix.debian }}-x86_64/
          mkdir -p dist/c-gateway-debian${{ matrix.debian }}-x86_64/scripts
          cp scripts/tls/generate-cert.sh dist/c-gateway-debian${{ matrix.debian }}-x86_64/scripts/
          tar -C dist -czf dist/fastp2p-gateway-debian${{ matrix.debian }}-x86_64.tar.gz c-gateway-debian${{ matrix.debian }}-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: fastp2p-gateway-debian${{ matrix.debian }}-x86_64
          path: dist/fastp2p-gateway-*.tar.gz
      - name: Gather sanitized test summaries
        if: always()
        run: |
          mkdir -p build/reports
          find /tmp -path '/tmp/fastp2p-gateway-*/logs/result.json' -exec cp --parents '{}' build/reports/ \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c-gateway-results-debian${{ matrix.debian }}
          path: build/reports/
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build gateway image
        run: docker build -f c/gateway/Dockerfile -t fastp2p-gateway:test .
      - name: Check native entrypoint
        run: docker run --rm fastp2p-gateway:test --version
      - name: Boot with private TLS certificate
        run: |
          bash scripts/tls/generate-cert.sh "$RUNNER_TEMP/c-gateway-tls" localhost 127.0.0.1 > "$RUNNER_TEMP/c-gateway-cert.log" 2>&1
          mkdir -p "$RUNNER_TEMP/c-gateway-state"
          docker run -d --name c-gateway-test --user "$(id -u):$(id -g)" \
            -e FASTP2P_USER=ci-test-admin -e FASTP2P_PASSWORD=ci-only-fixture-password -e FASTP2P_TOKEN=1234567890123456 \
            -v "$RUNNER_TEMP/c-gateway-tls/server.crt:/etc/fastp2p/tls/server.crt:ro" \
            -v "$RUNNER_TEMP/c-gateway-tls/server.key:/etc/fastp2p/tls/server.key:ro" \
            -v "$RUNNER_TEMP/c-gateway-tls/ca.crt:/etc/fastp2p/tls/ca.crt:ro" \
            -v "$RUNNER_TEMP/c-gateway-state:/var/lib/fastp2p" \
            -p 127.0.0.1:10008:10008 fastp2p-gateway:test
          for attempt in $(seq 1 40); do
            if curl -fsS --cacert "$RUNNER_TEMP/c-gateway-tls/ca.crt" https://127.0.0.1:10008/healthz; then exit 0; fi
            sleep 0.25
          done
          docker logs c-gateway-test
          exit 1
      - name: Stop test container
        if: always()
        run: docker rm -f c-gateway-test || true
      - name: Package Docker image
        run: |
          version=$(sed -n 's/.*project(fastp2p_c_gateway VERSION \([0-9.]*\).*/\1/p' c/gateway/CMakeLists.txt)
          docker tag fastp2p-gateway:test "fastp2p-gateway:$version"
          mkdir -p dist
          docker save "fastp2p-gateway:$version" | gzip -n > dist/fastp2p-gateway-docker-amd64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: fastp2p-gateway-docker-amd64
          path: dist/fastp2p-gateway-docker-amd64.tar.gz
  release:
    needs: [gateway, docker]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/fastp2p-gateway-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: fastp2p-gateway-*
          path: release-input
      - name: Publish verified gateway packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py --kind gateway --input release-input --output release-output
