name: fastp2p C clients
on:
  push:
    tags: ['fastp2p-client-v*']
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c-clients-${{ github.ref }}
  # A new push supersedes an older build of the same branch, so the runner queue
  # never waits behind a stale run. A tag build is never cancelled.
  cancel-in-progress: ${{ github.ref_type == 'branch' }}
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      musl_arches: ${{ steps.packaging.outputs.musl_arches }}
    steps:
      - uses: actions/checkout@v5
      - name: Packaging inputs and paths
        id: packaging
        run: |
          python3 -m py_compile scripts/*.py
          python3 scripts/sdk-metadata.py --check-inputs
          python3 scripts/check-packaging-inputs.py

  macos:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: ~/fastp2p-dev/cross
          key: c-deps-${{ matrix.target }}-${{ hashFiles('deps.lock.json', 'scripts/build-deps.py') }}
          restore-keys: c-deps-${{ matrix.target }}-
      - name: Build pinned dependencies
        run: python3 scripts/build-deps.py ${{ matrix.target }}
      - uses: actions/cache/save@v4
        if: steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: ~/fastp2p-dev/cross
          key: c-deps-${{ matrix.target }}-${{ hashFiles('deps.lock.json', 'scripts/build-deps.py') }}
      - name: Build CLI and C SDK
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DFASTP2P_DEPS_ROOT="$HOME/fastp2p-dev/cross/prefix/${{ matrix.target }}" -DCMAKE_INSTALL_PREFIX="$PWD/dist/${{ matrix.target }}"
          cmake --build build --parallel 3
          cmake --build build --target example-embed
          cmake --install build
          cmake -S tests/sdk-consumer -B build/consumer -G Ninja -DCMAKE_PREFIX_PATH="$PWD/dist/${{ matrix.target }}"
          cmake --build build/consumer
          build/consumer/sdk-consumer
      - name: Package SDK
        run: |
          python3 scripts/sdk-metadata.py --sdk dist/${{ matrix.target }}
          tar -C dist -czf dist/fastp2p-${{ matrix.target }}.tar.gz ${{ matrix.target }}
      - name: ABI, lifecycle and TLS validation
        run: |
          export OPENSSL_EXE="$(brew --prefix openssl@3)/bin/openssl"
          ctest --test-dir build --output-on-failure
          dist/${{ matrix.target }}/bin/fastp2p --version
      - name: Enroll a profile through the macOS /etc system alias
        run: |
          export OPENSSL_EXE="$(brew --prefix openssl@3)/bin/openssl"
          config_dir=$(sudo mktemp -d /etc/fastp2p-ci.XXXXXXXX)
          trap 'sudo rm -rf -- "$config_dir"' EXIT
          sudo chown "$(id -u)" "$config_dir"
          python3 tests/enrollment_integration.py --client build/fastp2p --gateway tests/gateway_fixture.py --profile-directory "$config_dir"
      - uses: actions/upload-artifact@v4
        with:
          name: fastp2p-${{ matrix.target }}
          path: dist/fastp2p-${{ matrix.target }}.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/desktop-result.json
            build/socks/result.json
            build/compile_commands.json
  cross-windows:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Restore the cross toolchain from cache
        uses: actions/cache@v4
        with:
          path: ~/mingw-toolchain.tar
          key: mingw-${{ runner.os }}-24.04-1
      - name: Install cross toolchain
        timeout-minutes: 15
        run: |
          set -euo pipefail
          if dpkg -s gcc-mingw-w64-x86-64 >/dev/null 2>&1; then
            echo "toolchain already present in the image"
            exit 0
          fi
          # A tarball this workflow wrote itself: restoring it is seconds, while an
          # apt round trip against a slow archive mirror has held this job for ten
          # minutes even with every package cached as a .deb.
          if [ -f "$HOME/mingw-toolchain.tar" ]; then
            echo "restoring the cached toolchain"
            sudo tar -C / -xf "$HOME/mingw-toolchain.tar"
            exit 0
          fi
          APT_OPTS=(-o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::ForceIPv4=true)
          # A hung mirror must not eat the whole budget: bound the update and retry
          # once before giving up.
          for attempt in 1 2; do
            if timeout 240 sudo apt-get "${APT_OPTS[@]}" update -qq &&
               sudo apt-get "${APT_OPTS[@]}" install -y gcc-mingw-w64-x86-64 ninja-build; then
              break
            fi
            if [ "$attempt" = 2 ]; then echo "::error::apt could not provide the cross toolchain"; exit 1; fi
            echo "::warning::apt attempt $attempt failed, retrying"
            sleep 10
          done
          sudo tar -C / -cf "$HOME/mingw-toolchain.tar" \
            $(dpkg -L gcc-mingw-w64-x86-64 gcc-mingw-w64-x86-64-posix gcc-mingw-w64-base \
                binutils-mingw-w64-x86-64 ninja-build 2>/dev/null | grep -E '^/(usr|etc)' | sort -u)

          python3 -m pip install cmake==3.31.6
      - uses: actions/cache@v4
        with:
          path: ~/fastp2p-dev/cross
          key: c-deps-windows-${{ hashFiles('deps.lock.json', 'scripts/build-deps.py') }}
          restore-keys: |
            c-deps-windows-
            c-deps-cross-
      - name: Windows CLI and SDK
        run: |
          python3 scripts/build-deps.py windows-x86_64
          cmake -S . -B build/windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/windows-x86_64.cmake" -DFASTP2P_DEPS_ROOT="$HOME/fastp2p-dev/cross/prefix/windows-x86_64"
          cmake --build build/windows --parallel 4
          cmake --install build/windows --prefix "$PWD/dist/windows-x86_64"
          python3 scripts/sdk-metadata.py --sdk dist/windows-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-validation
          path: |
            build/windows/*.exe
            build/windows/fastp2p.dll
            dist/windows-x86_64/
          if-no-files-found: error

  cross-android:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      variant: ${{ steps.android.outputs.variant }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache apt packages (ninja-build)
        uses: awalsh128/cache-apt-pkgs-action@v1
        continue-on-error: true
        with:
          packages: ninja-build
          version: 1.0
      - name: Android NDK
        timeout-minutes: 15
        run: |
          set -euo pipefail
          APT_OPTS=(-o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::ForceIPv4=true)
          # When the apt cache restored these packages, skip the archive
          # round trip entirely: a slow mirror was the last thing that could
          # still hold this job for minutes.
          if sudo dpkg -s ninja-build >/dev/null 2>&1; then
            echo "toolchain restored from the apt cache"
          else
            sudo apt-get "${APT_OPTS[@]}" update -qq
            sudo apt-get "${APT_OPTS[@]}" install -y ninja-build
          fi
          python3 -m pip install cmake==3.31.6
          # A dropped download used to kill the job; each attempt keeps the parts
          # sdkmanager already finished, so a retry only fetches what is missing.
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "build-tools;36.0.0" "platforms;android-36" > sdk-install.log 2>&1; then
              break
            fi
            if [ "$attempt" = 3 ]; then tail -60 sdk-install.log; exit 1; fi
            echo "::warning::sdkmanager attempt $attempt failed, retrying"
            sleep 15
          done
      - uses: actions/cache@v4
        with:
          path: ~/fastp2p-dev/cross
          key: c-deps-android-${{ hashFiles('deps.lock.json', 'scripts/build-deps.py') }}
          restore-keys: |
            c-deps-android-
            c-deps-cross-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-
      - name: Build and validate Android APK
        id: android
        timeout-minutes: 20
        env:
          FASTP2P_ANDROID_KEYSTORE_BASE64: ${{ secrets.FASTP2P_ANDROID_KEYSTORE_BASE64 }}
          FASTP2P_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FASTP2P_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          export FASTP2P_CMAKE_DIR="$(python3 -c 'import cmake,pathlib; print(pathlib.Path(cmake.CMAKE_BIN_DIR).parent)')"
          variant=debug
          if [[ -n "$FASTP2P_ANDROID_KEYSTORE_BASE64" && -n "$FASTP2P_ANDROID_KEYSTORE_PASSWORD" ]]; then
            variant=release
            export FASTP2P_ANDROID_KEYSTORE="$RUNNER_TEMP/fastp2p-android.p12"
            (umask 077; printf '%s' "$FASTP2P_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$FASTP2P_ANDROID_KEYSTORE")
            trap 'rm -f -- "$FASTP2P_ANDROID_KEYSTORE"' EXIT
          elif [[ "$GITHUB_REF_TYPE" == tag || -n "$FASTP2P_ANDROID_KEYSTORE_BASE64$FASTP2P_ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Configure both Android signing secrets to build an APK for release."
            exit 1
          else
            echo "::notice::Building a debug APK for CI validation. Configure the Android signing secrets to include a signed APK in Releases."
          fi
          # Maven Central answers 429 under load; a retry reuses everything Gradle
          # already downloaded, so a transient refusal no longer fails the run.
          for attempt in 1 2 3; do
            if bash scripts/build-android.sh > android-build.log 2>&1; then
              break
            fi
            if [ "$attempt" = 3 ]; then tail -80 android-build.log; exit 1; fi
            echo "::warning::android build attempt $attempt failed, retrying"
            sleep 20
          done
          apk="android/app/build/outputs/apk/$variant/app-$variant.apk"
          python3 tests/android_artifact.py --apk "$apk" --ndk "$ANDROID_NDK_HOME"
          if [[ "$variant" == release ]]; then
            mkdir -p dist/android
            cp "$apk" dist/android/fastp2p-android.apk
          fi
          echo "variant=$variant" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.android.outputs.variant == 'release'
        with:
          name: fastp2p-android
          path: dist/android/fastp2p-android.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.android.outputs.variant == 'debug'
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-device-validation
          path: android/app/build/outputs/apk/androidTest/${{ steps.android.outputs.variant }}/app-${{ steps.android.outputs.variant }}-androidTest.apk
          if-no-files-found: error
      # Debuggable build signed with the release key: installs over the production
      # app and writes the client event stream to logcat. It is only produced from
      # main, because it carries the production certificate. Never published.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.android.outputs.variant == 'release'
        with:
          name: android-debug-logging
          path: android/app/build/outputs/apk/staging/app-staging.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-cross
          path: |
            android-build.log
            sdk-install.log
            android/app/build/reports/lint-results-release.*

  windows:
    needs: [preflight, cross-windows]
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: windows-validation
      - name: Package Windows installer exe
        shell: pwsh
        run: |
          Copy-Item build/windows/fastp2p.exe dist/fastp2p-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: fastp2p-windows-x86_64
          path: dist/fastp2p-windows-x86_64.exe
          if-no-files-found: error
      - name: Windows client reports its version
        shell: pwsh
        run: |
          & build/windows/fastp2p.exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Windows startup, pipes and logs
        shell: pwsh
        run: |
          python tests/windows_startup.py --client build/windows/fastp2p.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Windows native unit tests (API, platform, wire, secure, session, socks)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($t in @('test-api','test-platform','test-wire','test-secure','test-session-binding','test-socks')) {
            Write-Host "::group::$t"
            & "build/windows/$t.exe"
            if ($LASTEXITCODE) { Write-Host "::error::$t failed with $LASTEXITCODE"; exit $LASTEXITCODE }
            Write-Host "::endgroup::"
          }
      - name: Windows native unit tests (update, QUIC buffer, TCP NAT)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($t in @('test-update-windows','test-quic-buffer','test-tcp-nat')) {
            Write-Host "::group::$t"
            & "build/windows/$t.exe"
            if ($LASTEXITCODE) { Write-Host "::error::$t failed with $LASTEXITCODE"; exit $LASTEXITCODE }
            Write-Host "::endgroup::"
          }
      - name: Windows service and SD-WAN unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($t in @('test-service-windows','test-sdwan-windows')) {
            Write-Host "::group::$t"
            & "build/windows/$t.exe"
            if ($LASTEXITCODE) { Write-Host "::error::$t failed with $LASTEXITCODE"; exit $LASTEXITCODE }
            Write-Host "::endgroup::"
          }
      - name: Windows CLI identity
        shell: pwsh
        run: |
          python tests/identity_cli.py --client build/windows/fastp2p.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Windows TLS rejection
        shell: pwsh
        run: |
          $env:OPENSSL_EXE = 'C:\Program Files\Git\usr\bin\openssl.exe'
          python tests/tls_negative.py --client build/windows/fastp2p.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Windows QUIC interop
        shell: pwsh
        run: |
          python tests/quic_native.py --binary build/windows/quic-interop.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Windows enrollment integration
        shell: pwsh
        run: |
          python tests/enrollment_integration.py --client build/windows/fastp2p.exe --gateway tests/gateway_fixture.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Windows config sync integration
        shell: pwsh
        run: |
          python tests/config_sync.py --client build/windows/fastp2p.exe --gateway tests/gateway_fixture.py --profile-probe build/windows/test-profile-probe.exe --fixture
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Windows SOCKS integration
        shell: pwsh
        run: |
          python tests/socks_integration.py --client build/windows/fastp2p.exe --gateway tests/gateway_fixture.py --logs build/windows/socks
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: MSVC consumer of the C DLL
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          lib /nologo /machine:x64 /def:platform\windows\fastp2p.def /out:dist\windows-x86_64\lib\fastp2p.lib
          if errorlevel 1 exit /b 1
          cmake -S tests/sdk-consumer -B build/msvc -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%CD%/dist/windows-x86_64"
          if errorlevel 1 exit /b 1
          cmake --build build/msvc
          if errorlevel 1 exit /b 1
          copy /y dist\windows-x86_64\bin\fastp2p.dll build\msvc\fastp2p.dll
          build\msvc\sdk-consumer.exe
          if errorlevel 1 exit /b 1
      # Windows is shipped as one exe. It carries no token: users rename it with
      # their 16-digit key after downloading, then double-click to install. The
      # Windows SDK (dll/headers) is no longer a Release asset; developers can
      # still get it from the cross job's windows-validation CI artifact.
  linux:
    needs: preflight
    runs-on: ubuntu-24.04
    container:
      image: python:3.13-slim-bookworm
      options: --privileged
    timeout-minutes: 35
    steps:
      - name: Native Debian 12 build dependencies
        run: |
          # This job runs inside a slim container: sh, not bash, so no arrays.
          apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::ForceIPv4=true update -qq
          apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::ForceIPv4=true install -y git curl wget python3 ca-certificates build-essential cmake ninja-build pkg-config openssl iproute2 iptables libwebsockets-dev libjson-c-dev libssl-dev libsqlite3-dev zstd
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: ~/fastp2p-dev/cross
          key: gateway-client-deps-debian12-${{ hashFiles('deps.lock.json', 'scripts/build-deps.py') }}
      - name: Linux dependencies for the SDK
        # The configure step resolves libcrypto and friends under FASTP2P_DEPS_ROOT, which
        # an empty cache does not provide - the monorepo cache always had them.
        run: python3 scripts/build-deps.py linux-x86_64
      - name: Package native C client SDK
        run: |
          cmake -S . -B build/client-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DFASTP2P_DEPS_ROOT="$HOME/fastp2p-dev/cross/prefix/linux-x86_64" -DCMAKE_INSTALL_PREFIX="$PWD/dist/sdk-linux-x86_64"
          cmake --build build/client-release --parallel 3
          cmake --install build/client-release
          python3 scripts/sdk-metadata.py --sdk dist/sdk-linux-x86_64
          tar -C dist -czf dist/fastp2p-sdk-linux-x86_64.tar.gz sdk-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: fastp2p-sdk-linux-x86_64
          path: dist/fastp2p-sdk-linux-x86_64.tar.gz
          if-no-files-found: error
      - name: Native tests and installed SDK consumer
        run: |
          ctest --test-dir build/client-release --output-on-failure
          cmake -S tests/sdk-consumer -B build/consumer -G Ninja -DCMAKE_PREFIX_PATH="$PWD/dist/sdk-linux-x86_64"
          cmake --build build/consumer
          build/consumer/sdk-consumer
      - name: STUN responder wire behaviour
        run: python3 scripts/stun/test-responder.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-linux
          path: build/client-release/Testing/Temporary/LastTest.log
  musl:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.preflight.outputs.musl_arches) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Cache apt packages (ninja-build)
        uses: awalsh128/cache-apt-pkgs-action@v1
        continue-on-error: true
        with:
          packages: ninja-build qemu-user-static
          version: 1.0
      - name: Static musl toolchain and emulator
        run: |
          APT_OPTS=(-o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::ForceIPv4=true)
          # When the apt cache restored these packages, skip the archive
          # round trip entirely: a slow mirror was the last thing that could
          # still hold this job for minutes.
          if sudo dpkg -s ninja-build qemu-user-static >/dev/null 2>&1; then
            echo "toolchain restored from the apt cache"
          else
            sudo apt-get "${APT_OPTS[@]}" update -qq
            sudo apt-get "${APT_OPTS[@]}" install -y ninja-build qemu-user-static
          fi

      - uses: actions/cache@v4
        with:
          path: ~/musl-cross
          key: musl-cross-${{ matrix.arch }}
      - uses: actions/cache@v4
        with:
          path: ~/fastp2p-dev/musl
          key: musl-deps-${{ matrix.arch }}-${{ hashFiles('deps.lock.json', 'scripts/build-deps.py') }}
      - name: Build static client
        run: FASTP2P_MUSL_OUT="$PWD/dist" bash scripts/build-musl.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: fastp2p-linux-static-${{ matrix.arch }}
          path: dist/fastp2p-linux-static-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
  release:
    # Every job that produces a client artifact has to finish first: the SDK comes
    # from the linux job and the Windows exe from the windows job, so publishing
    # without them would silently ship an incomplete release.
    needs: [macos, cross-windows, cross-android, linux, windows, musl]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/fastp2p-client-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: fastp2p-*
          path: release-input
      - name: Publish verified clients and C SDKs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANDROID_VARIANT: ${{ needs.cross-android.outputs.variant }}
        run: |
          args=()
          if [[ "$ANDROID_VARIANT" == debug && "$GITHUB_REF_TYPE" == branch ]]; then
            args+=(--without-android)
          fi
          python3 scripts/publish-release.py --kind client --input release-input --output release-output "${args[@]}"
