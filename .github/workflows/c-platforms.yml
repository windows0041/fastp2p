name: fastp2p C clients
on:
  push:
    tags: ['fastp2p-client-v*']
    branches: ['**']
    paths: ['c/client/**', 'c/common/**', 'scripts/tls/**', '.github/workflows/c-platforms.yml', 'scripts/publish-release.py', 'scripts/test-publish-release.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c-clients-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: ~/fastp2p-dev/cross
          key: c-deps-${{ matrix.target }}-${{ hashFiles('c/client/deps.lock.json', 'c/client/scripts/build-deps.py') }}
          restore-keys: c-deps-${{ matrix.target }}-
      - name: Build pinned dependencies
        run: python3 c/client/scripts/build-deps.py ${{ matrix.target }}
      - uses: actions/cache/save@v4
        if: steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: ~/fastp2p-dev/cross
          key: c-deps-${{ matrix.target }}-${{ hashFiles('c/client/deps.lock.json', 'c/client/scripts/build-deps.py') }}
      - name: Build CLI and C SDK
        run: |
          cmake -S c/client -B build/c -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DFASTP2P_DEPS_ROOT="$HOME/fastp2p-dev/cross/prefix/${{ matrix.target }}" -DCMAKE_INSTALL_PREFIX="$PWD/dist/${{ matrix.target }}"
          cmake --build build/c --parallel 3
          cmake --build build/c --target example-embed
          cmake --install build/c
          cmake -S c/client/tests/sdk-consumer -B build/consumer -G Ninja -DCMAKE_PREFIX_PATH="$PWD/dist/${{ matrix.target }}"
          cmake --build build/consumer
          build/consumer/sdk-consumer
      - name: ABI, lifecycle and TLS validation
        run: |
          export OPENSSL_EXE="$(brew --prefix openssl@3)/bin/openssl"
          ctest --test-dir build/c --output-on-failure
          dist/${{ matrix.target }}/bin/fastp2p --version
      - name: Native C QUIC and token enrollment
        run: |
          export OPENSSL_EXE="$(brew --prefix openssl@3)/bin/openssl"
          python3 c/client/tests/quic_native.py --binary build/c/quic-interop
          python3 c/client/tests/enrollment_integration.py --client build/c/fastp2p --gateway c/client/tests/gateway_fixture.py
      - name: Package SDK
        run: |
          python3 c/client/scripts/sdk-metadata.py --sdk dist/${{ matrix.target }}
          tar -C dist -czf dist/fastp2p-${{ matrix.target }}.tar.gz ${{ matrix.target }}
      - name: Native SOCKS5 TCP, UDP, authentication and reconnect
        run: |
          export OPENSSL_EXE="$(brew --prefix openssl@3)/bin/openssl"
          python3 c/client/tests/socks_integration.py --client build/c/fastp2p --gateway c/client/tests/gateway_fixture.py --logs build/c/socks
      - uses: actions/upload-artifact@v4
        with:
          name: fastp2p-${{ matrix.target }}
          path: dist/fastp2p-*.tar.gz
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            build/c/Testing/Temporary/LastTest.log
            build/c/desktop-result.json
            build/c/socks/result.json
            build/c/compile_commands.json
  cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-x86-64 ninja-build
          python3 -m pip install cmake==3.31.6
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "build-tools;36.0.0" "platforms;android-36" > sdk-install.log 2>&1 || { tail -60 sdk-install.log; exit 1; }
      - uses: actions/cache@v4
        with:
          path: ~/fastp2p-dev/cross
          key: c-deps-cross-${{ hashFiles('c/client/deps.lock.json', 'c/client/scripts/build-deps.py') }}
          restore-keys: c-deps-cross-
      - name: Windows CLI and SDK
        run: |
          python3 c/client/scripts/build-deps.py windows-x86_64
          cmake -S c/client -B build/windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$PWD/c/client/cmake/windows-x86_64.cmake" -DFASTP2P_DEPS_ROOT="$HOME/fastp2p-dev/cross/prefix/windows-x86_64"
          cmake --build build/windows --parallel 4
          cmake --install build/windows --prefix "$PWD/dist/windows-x86_64"
          python3 c/client/scripts/sdk-metadata.py --sdk dist/windows-x86_64
          cp build/windows/fastp2p.exe dist/fastp2p-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-validation
          path: |
            build/windows/*.exe
            build/windows/fastp2p.dll
            dist/windows-x86_64/
      - name: Android signed headless APK
        env:
          FASTP2P_ANDROID_KEYSTORE_BASE64: ${{ secrets.FASTP2P_ANDROID_KEYSTORE_BASE64 }}
          FASTP2P_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FASTP2P_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          export FASTP2P_CMAKE_DIR="$(python3 -c 'import cmake,pathlib; print(pathlib.Path(cmake.CMAKE_BIN_DIR).parent)')"
          test -n "$FASTP2P_ANDROID_KEYSTORE_BASE64" && test -n "$FASTP2P_ANDROID_KEYSTORE_PASSWORD"
          export FASTP2P_ANDROID_KEYSTORE="$RUNNER_TEMP/fastp2p-android.p12"
          printf '%s' "$FASTP2P_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$FASTP2P_ANDROID_KEYSTORE"
          chmod 600 "$FASTP2P_ANDROID_KEYSTORE"
          bash c/client/scripts/build-android.sh > android-build.log 2>&1 || { tail -80 android-build.log; exit 1; }
          python3 c/client/tests/android_artifact.py --apk c/client/android/app/build/outputs/apk/release/app-release.apk --ndk "$ANDROID_NDK_HOME"
          mkdir -p dist/android
          cp c/client/android/app/build/outputs/apk/release/app-release.apk dist/android/fastp2p-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fastp2p-android
          path: dist/android/fastp2p-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-device-validation
          path: c/client/android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
      # Debuggable build signed with the release key: installs over the production
      # app and writes the client event stream to logcat. It is only produced from
      # main, because it carries the production certificate. Never published.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: android-debug-logging
          path: c/client/android/app/build/outputs/apk/staging/app-staging.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-cross
          path: |
            android-build.log
            sdk-install.log
            c/client/android/app/build/reports/lint-results-release.*
  windows:
    needs: cross
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: windows-validation
      - name: Native Windows protocol, lifecycle, TLS and QUIC tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & build/windows/fastp2p.exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & build/windows/test-api.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python c/client/tests/identity_cli.py --client build/windows/fastp2p.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & build/windows/test-platform.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & build/windows/test-wire.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & build/windows/test-secure.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & build/windows/test-session-binding.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & build/windows/test-socks.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:OPENSSL_EXE = 'C:\Program Files\Git\usr\bin\openssl.exe'
          python c/client/tests/tls_negative.py --client build/windows/fastp2p.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python c/client/tests/quic_native.py --binary build/windows/quic-interop.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python c/client/tests/enrollment_integration.py --client build/windows/fastp2p.exe --gateway c/client/tests/gateway_fixture.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python c/client/tests/socks_integration.py --client build/windows/fastp2p.exe --gateway c/client/tests/gateway_fixture.py --logs build/windows/socks
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: MSVC consumer of the C DLL
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          lib /nologo /machine:x64 /def:c\client\platform\windows\fastp2p.def /out:dist\windows-x86_64\lib\fastp2p.lib
          if errorlevel 1 exit /b 1
          cmake -S c/client/tests/sdk-consumer -B build/msvc -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%CD%/dist/windows-x86_64"
          if errorlevel 1 exit /b 1
          cmake --build build/msvc
          if errorlevel 1 exit /b 1
          copy /y dist\windows-x86_64\bin\fastp2p.dll build\msvc\fastp2p.dll
          build\msvc\sdk-consumer.exe
          if errorlevel 1 exit /b 1
      # Windows is shipped as one exe. It carries no token: users rename it with
      # their 16-digit key after downloading, then double-click to install. The
      # Windows SDK (dll/headers) is no longer a Release asset; developers can
      # still get it from the cross job's windows-validation CI artifact.
      - name: Package Windows installer exe
        shell: pwsh
        run: |
          Copy-Item build/windows/fastp2p.exe dist/fastp2p-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: fastp2p-windows-x86_64
          path: dist/fastp2p-windows-x86_64.exe
  linux:
    runs-on: ubuntu-24.04
    container:
      image: python:3.13-slim-bookworm
      options: --privileged
    timeout-minutes: 35
    steps:
      - name: Native Debian 12 build dependencies
        run: |
          apt-get update -qq
          apt-get install -y git curl ca-certificates build-essential cmake ninja-build pkg-config openssl iproute2 libwebsockets-dev libjson-c-dev libssl-dev libsqlite3-dev zstd
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: ~/fastp2p-dev/cross
          key: gateway-client-deps-debian12-${{ hashFiles('c/client/deps.lock.json', 'c/client/scripts/build-deps.py') }}
      - name: Build C client and C gateway with sanitizers
        run: |
          python3 c/client/scripts/build-deps.py linux-x86_64
          cmake -S c/client -B build/c -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFASTP2P_SANITIZE=ON -DFASTP2P_DEPS_ROOT="$HOME/fastp2p-dev/cross/prefix/linux-x86_64"
          cmake --build build/c --parallel 3
          ctest --test-dir build/c --output-on-failure
          cmake -S c/gateway -B build/c-gateway -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFASTP2P_SANITIZE=ON
          cmake --build build/c-gateway --parallel 3
      - name: C SOCKS5, QUIC and token enrollment
        run: |
          bash c/client/scripts/check-socks.sh
          python3 c/client/tests/quic_native.py --binary build/c/quic-interop
          python3 c/client/tests/enrollment_integration.py --client build/c/fastp2p --gateway build/c-gateway/fastp2p-gateway
      - name: C relay fallback over TCP and QUIC
        run: |
          FASTP2P_C_BUILD_DIR="$PWD/build/c" \
          FASTP2P_C_GATEWAY_BUILD_DIR="$PWD/build/c-gateway" \
          bash c/client/scripts/check-relay.sh
      - name: C relay escalation when a punch cannot succeed
        run: |
          FASTP2P_C_BUILD_DIR="$PWD/build/c" \
          FASTP2P_C_GATEWAY_BUILD_DIR="$PWD/build/c-gateway" \
          bash c/client/scripts/check-escalation.sh
      - name: C punch with a peer advertising a mapping window
        run: |
          FASTP2P_C_BUILD_DIR="$PWD/build/c" \
          FASTP2P_C_GATEWAY_BUILD_DIR="$PWD/build/c-gateway" \
          bash c/client/scripts/check-nat-window.sh
      - name: Web console pushes SOCKS5 with a custom port
        run: |
          FASTP2P_C_BUILD_DIR="$PWD/build/c" \
          FASTP2P_C_GATEWAY_BUILD_DIR="$PWD/build/c-gateway" \
          bash c/client/scripts/check-console-socks.sh
      - name: Rules persist in the gateway and survive a client restart
        run: |
          FASTP2P_C_BUILD_DIR="$PWD/build/c" \
          FASTP2P_C_GATEWAY_BUILD_DIR="$PWD/build/c-gateway" \
          bash c/client/scripts/check-rule-persistence.sh
      - name: Remote client upgrade through the gateway
        run: |
          FASTP2P_C_BUILD_DIR="$PWD/build/c" \
          FASTP2P_C_GATEWAY_BUILD_DIR="$PWD/build/c-gateway" \
          bash c/client/scripts/check-update.sh
      - name: Package native C client SDK
        run: |
          cmake -S c/client -B build/client-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DFASTP2P_DEPS_ROOT="$HOME/fastp2p-dev/cross/prefix/linux-x86_64" -DCMAKE_INSTALL_PREFIX="$PWD/dist/sdk-linux-x86_64"
          cmake --build build/client-release --parallel 3
          cmake --install build/client-release
          python3 c/client/scripts/sdk-metadata.py --sdk dist/sdk-linux-x86_64
          tar -C dist -czf dist/fastp2p-sdk-linux-x86_64.tar.gz sdk-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: fastp2p-sdk-linux-x86_64
          path: dist/fastp2p-sdk-linux-x86_64.tar.gz
      - name: Gather sanitized SOCKS5 summaries
        if: always()
        run: |
          mkdir -p build/socks-reports
          find /tmp -path '/tmp/fastp2p-socks-tests.*/result.json' -exec cp --parents '{}' build/socks-reports/ \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: socks5-results-linux
          path: build/socks-reports/
  musl:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, armv7, i686, riscv64, s390x, ppc64le, mips64el]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Static musl toolchain and emulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build qemu-user-static
      - uses: actions/cache@v4
        with:
          path: ~/musl-cross
          key: musl-cross-${{ matrix.arch }}
      - uses: actions/cache@v4
        with:
          path: ~/fastp2p-dev/musl
          key: musl-deps-${{ matrix.arch }}-${{ hashFiles('c/client/deps.lock.json', 'c/client/scripts/build-deps.py') }}
      - name: Build static client
        run: FASTP2P_MUSL_OUT="$PWD/dist" bash c/client/scripts/build-musl.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: fastp2p-linux-static-${{ matrix.arch }}
          path: dist/fastp2p-linux-static-${{ matrix.arch }}.tar.gz
  release:
    needs: [macos, cross, linux, windows, musl]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/fastp2p-client-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: fastp2p-*
          path: release-input
      - name: Publish verified clients and C SDKs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py --kind client --input release-input --output release-output
